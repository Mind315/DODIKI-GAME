<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Karen and Friends</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-screen="menu">
    <section class="main-menu" aria-label="Выбор персонажа">
      <div class="menu-panel">
        <h1>Karen and Friends</h1>
        <p>Выбери персонажа</p>
        <div class="character-list">
          <button type="button" class="character-button is-active" data-start-character="KAREN">KAREN</button>
          <button type="button" class="character-button is-active" data-start-character="RAZOLTER">Razolter</button>
          <button type="button" class="character-button" disabled>Flaffy</button>
          <button type="button" class="character-button" disabled>Sidius</button>
          <button type="button" class="character-button" disabled>Игорь-Игорь</button>
          <button type="button" class="character-button" disabled>B4CHA</button>
          <button type="button" class="character-button" disabled>ЛЕГЕНДА</button>
          <button type="button" class="character-button" disabled>MIND</button>
        </div>
      </div>
    </section>

    <main class="game" aria-label="Игра Karen and Friends" aria-hidden="true">
      <button type="button" class="menu-return" data-return-menu>Вернуться в меню</button>

      <section class="action-panel karen-action-panel" data-character-panel="KAREN" aria-label="Действия Karen">
        <div class="animal-tabs" role="tablist" aria-label="Выбор животного">
          <button type="button" class="animal-tab" data-animal-tab="horse" role="tab" aria-selected="false">Лошадь</button>
          <button type="button" class="animal-tab" data-animal-tab="cat" role="tab" aria-selected="false">Кошка</button>
        </div>

        <div class="animal-actions" data-animal-actions="horse" hidden>
          <button type="button" data-action="mount">Сесть на лошадь</button>
          <button type="button" data-action="dismount">Слезть с лошади</button>
        </div>

        <div class="animal-actions" data-animal-actions="cat" hidden>
          <button type="button" data-cat="sit">Сидеть</button>
          <button type="button" data-cat="lie">Лежать</button>
          <button type="button" data-cat="jump">Прыгать</button>
          <button type="button" data-cat="stand">Стоять</button>
          <button type="button" data-move="left">Влево</button>
          <button type="button" data-move="right">Вправо</button>
        </div>
      </section>

      <section class="action-panel razolter-action-panel" data-character-panel="RAZOLTER" aria-label="Действия Razolter" hidden>
        <button type="button" class="razolter-action-button" data-razolter-action>Действия</button>
        <div class="razolter-actions" data-razolter-actions hidden>
          <button type="button" data-razolter-move="pushup">Отжаться</button>
          <button type="button" data-razolter-move="sleep">Лечь спать</button>
          <button type="button" data-razolter-move="fridge">Подойти к холодильнику</button>
          <span class="beer-hint" data-beer-hint title="Сначала подойди к холодильнику">
            <button type="button" data-razolter-move="beer" disabled>Достать пиво</button>
          </span>
          <button type="button" data-razolter-move="beer-private">Пить пиво и дрочить</button>
          <button type="button" data-razolter-move="sing">Петь песню</button>
          <button type="button" data-razolter-move="dance">Танцевать</button>
          <button type="button" data-razolter-move="eyes">Открыть глаза</button>
          <button type="button" data-razolter-move="private">Мастурбировать</button>
        </div>
      </section>

      <section class="status-panel" aria-label="Данные персонажа">
        <div class="status-row mood-row">
          <span class="status-label">Настроение:</span>
          <div class="mood-display" aria-label="Настроение 100%">
            <span class="mood-face" data-mood-face>😄</span>
            <span class="mood-percent" data-mood-percent>100%</span>
          </div>
        </div>
        <div class="status-row">
          <span class="status-label">Деньги:</span>
          <span class="money-value" data-money>0$</span>
        </div>
        <div class="status-tools">
          <button type="button" class="icon-button" data-panel-toggle="inventory" aria-label="Открыть инвентарь" title="Инвентарь">▤ инв</button>
          <button type="button" class="icon-button" data-panel-toggle="shop" aria-label="Открыть магазин" title="Магазин">$ Магаз</button>
        </div>
      </section>

      <aside class="slide-panel inventory-panel" data-slide-panel="inventory" aria-label="Инвентарь" aria-hidden="true">
        <h2>Инвентарь</h2>
        <div class="inventory-list" data-inventory-list>
          <p class="empty-note">Пока пусто</p>
        </div>
      </aside>

      <aside class="slide-panel shop-panel" data-slide-panel="shop" aria-label="Магазин" aria-hidden="true">
        <h2>Магазин</h2>
        <div class="shop-list">
          <button type="button" class="shop-item" data-buy-item="Яблоко" data-price="5">
            <span>Яблоко</span>
            <strong>5$</strong>
          </button>
          <button type="button" class="shop-item" data-buy-item="Лента" data-price="12">
            <span>Лента</span>
            <strong>12$</strong>
          </button>
          <button type="button" class="shop-item" data-buy-item="Игрушка" data-price="20">
            <span>Игрушка</span>
            <strong>20$</strong>
          </button>
        </div>
      </aside>

      <div class="sky">
        <span class="cloud cloud-one"></span>
        <span class="cloud cloud-two"></span>
        <span class="sun"></span>
      </div>

      <div class="room" aria-hidden="true">
        <span class="room-wall wall-back"></span>
        <span class="room-wall wall-left"></span>
        <span class="room-wall wall-right"></span>
        <span class="room-ceiling"></span>
        <span class="room-roof"></span>
        <span class="room-floor"></span>
        <span class="bed">
          <span class="bed-pillow"></span>
          <span class="bed-blanket"></span>
        </span>
        <span class="fridge">
          <span class="fridge-beers">
            <span class="fridge-beer"></span>
            <span class="fridge-beer"></span>
            <span class="fridge-beer"></span>
          </span>
          <span class="fridge-door">
            <span class="fridge-handle"></span>
          </span>
        </span>
        <span class="room-spot" aria-hidden="true"></span>
      </div>

      <div class="scene" data-riding="false" data-cat-state="sit">
        <div class="horse" aria-label="Лошадь">
          <span class="horse-speech">я не машина, какой руль блять, Карен???</span>
          <span class="horse-tail"></span>
          <span class="horse-body"></span>
          <span class="horse-neck"></span>
          <span class="horse-head"></span>
          <span class="horse-ear horse-ear-left"></span>
          <span class="horse-ear horse-ear-right"></span>
          <span class="horse-mane"></span>
          <span class="horse-eye"></span>
          <span class="horse-leg leg-front-one"></span>
          <span class="horse-leg leg-front-two"></span>
          <span class="horse-leg leg-back-one"></span>
          <span class="horse-leg leg-back-two"></span>
          <span class="saddle"></span>
        </div>

        <div class="person" aria-label="Karen">
          <span class="name-tag">KAREN</span>
          <span class="speech">Я тебя дрессирую кошечка, выполняй команды</span>
          <span class="head"></span>
          <span class="hair"></span>
          <span class="body"></span>
          <span class="arm arm-left"></span>
          <span class="arm arm-right"></span>
          <span class="leg person-leg-left"></span>
          <span class="leg person-leg-right"></span>
        </div>

        <div class="cat" aria-label="Кошка">
          <span class="cat-tail"></span>
          <span class="cat-body"></span>
          <span class="cat-head"></span>
          <span class="cat-ear cat-ear-left"></span>
          <span class="cat-ear cat-ear-right"></span>
          <span class="cat-eye cat-eye-left"></span>
          <span class="cat-eye cat-eye-right"></span>
          <span class="cat-leg cat-leg-one"></span>
          <span class="cat-leg cat-leg-two"></span>
        </div>

        <div class="razolter" aria-label="Razolter">
          <span class="name-tag razolter-name">RAZOLTER</span>
          <span class="razolter-speech" data-razolter-speech></span>
          <span class="razolter-head"></span>
          <span class="razolter-hair"></span>
          <span class="razolter-body"></span>
          <span class="razolter-arm razolter-arm-left"></span>
          <span class="razolter-arm razolter-arm-right"></span>
          <span class="razolter-leg razolter-leg-left"></span>
          <span class="razolter-leg razolter-leg-right"></span>
          <span class="razolter-note note-one">♪</span>
          <span class="razolter-note note-two">♫</span>
        </div>

        <div class="message" aria-live="polite">Кошка сидит и смотрит на Karen.</div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
